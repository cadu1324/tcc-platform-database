version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: tcc_platform_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tcc_admin
      POSTGRES_PASSWORD: tcc_secret_2024
      POSTGRES_DB: tcc_platform
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d/migrations:ro
      - ./seeds:/docker-entrypoint-initdb.d/seeds:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tcc_admin -d tcc_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
